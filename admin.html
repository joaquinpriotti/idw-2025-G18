<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Administración - Médicos</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <header class="container-fluid text-white py-3">
        <div class="d-flex align-items-center">
            <img src="favicon.svg" alt="Logo" height="60" />
            <h1 class="ms-3">Clínica Médica - Administración</h1>
        </div>
    </header>

    <main class="container my-4">
        <section>
            <h2>Gestión de Médicos</h2>
            <p>Esta vista utiliza el mismo módulo JS (listado y acciones). Podés abrir <a
                    href="altaMedicos.html">Alta/Edición</a> para crear nuevos médicos.</p>
        </section>

        <section class="mt-4">
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-success">
                        <tr>
                            <th>Matrícula</th>
                            <th>Nombre</th>
                            <th>Especialidad</th>
                            <th>Teléfono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="medicos-tbody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="footer text-center py-3">
        <p>&copy; T.F.I. | Introducción al Desarrollo Web - 2025</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/altaMedicos.js"></script>
</body>

</html>
