<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Clínica Médica</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header class="container-fluid text-white py-3">
        <div class="d-flex align-items-center">
            <img src="favicon.svg" alt="Logo de la clínica" height="60">
        </div>
    </header>

    <main class="container my-5">
        <h1 class="text-center mb-4 text-primary">Iniciar sesión</h1>

        <form id="formLogin" class="contacto-form" method="post" action="#">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input id="usuario" name="usuario" type="text" class="form-control form-control-lg"
                    placeholder="Nombre de usuario" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input id="contrasena" name="contrasena" type="password" class="form-control form-control-lg"
                    placeholder="*********" required autocomplete="current-password">
            </div>
            <div class="d-grid margin-2">
                <button class="btn btn-primary margin-bottom-2" type="submit">Iniciar sesión</button>
            </div>
            <div id="mensaje" class="alert text-center" role="alert" style="display:none;"></div>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; T.F.I. | Introducción al Desarrollo Web - 2025</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/login.js"></script>

</body>

</html>
