<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto - Clínica Médica</title>
        <link rel="stylesheet" href="css/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>

        <header class="container-fluid text-white py-3">
            <div class="d-flex align-items-center">
                <img src="favicon.svg" alt="Logo de la clínica" height="60">
                <h1 class="ms-3">Clínica Médica</h1>
            </div>
        </header>

        <nav class="navbar navbar-expand-md navbar-dark">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Mostrar menú">
                    <span class="navbar-toggler-icon"></span>
                </button>              
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="institucional.html">Institucional</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        <li id="botonDinamico" class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
                    </ul>
                </div>
            </div>
        </nav>


        <main class="container my-5">
            <h1 class="text-center mb-4 text-primary">Alta médicos</h1>

            <form id="formularioAlta" class="contacto-form">
                <div class="mb-3">
                    <label for="nombreAlta" class="form-label">Nombre y Apellido</label>
                    <input id="nombreAlta" name="nombreAlta" type="text" class="form-control form-control-lg"
                        placeholder="Nombre y Apellido" required>
                </div>
                <div class="mb-3">
                    <label for="dniAlta" class="form-label">DNI</label>
                    <input id="dniAlta" name="dniAlta" type="num" class="form-control form-control-lg" placeholder="DNI" required>
                </div>
                <div class="mb-3">
                    <label for="obrasocialAlta" class="form-label">Obra social</label>
                    <input id="obrasocialAlta" name="obrasocialAlta" type="text" class="form-control form-control-lg" placeholder="Obra social">
                </div>
                <div class="mb-3">
                    <label for="especialidadAlta" class="form-label">Especialidad</label>
                    <input id="especialidadAlta" name="especialidadAlta" type="text" class="form-control form-control-lg" placeholder="Especialidad">
                </div>
                <div class="d-grid margin-2">
                    <button class="btn btn-primary margin-bottom-2" type="submit">Confirmar</button>
                </div>
            </form>
        </main>

        <section class ="container my-5 border p-4 rounded-3 shadow">
            <h3 class = "mb-3">Tabla de Medicos </h3>
            <div class = "table-responsive-sm ">
                <table class="table table-bordered align-middle " id ="tabla_Medicos">
                    <thead class = "table-success">
                        <tr>
                            <th>Nombre y Apellido</th>
                            <th>DNI</th>
                            <th>Especialidad</th>
                            <th>Obra Social</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpotabla">
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td>
                                <button class = "btn btn-primary" id = "editar">Editar</button>
                                <button class="btn btn-danger" id="eliminar" >Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <footer class="footer">
            <p>&copy; T.F.I. | Introducción al Desarrollo Web - 2025</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/altaMedicos.js"></script>
    </body>

</html>
