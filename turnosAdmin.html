<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alta - Clínica Médica</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <header class="container-fluid text-white py-3">
        <div class="d-flex align-items-center">
            <img src="favicon.svg" alt="Logo de la clínica" height="60" />
            <h1 class="ms-3">Clínica Médica</h1>
        </div>
    </header>

    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="institucional.html">Institucional</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <div id="botonAdmin"></div>
                    <div id="botonDinamico"></div>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="text-center mb-4 text-primary">Alta y Administración de Turnos</h2>

        <section class="mb-4">
            <form id="formularioTurnos" class="row g-3">
                <input type="hidden" id="turnosId" />

                <div class="col-md-6">
                    <label for="nombreTurno" class="form-label">Médico</label>
                    <input id="nombreTurno" name="nombreTurno" type="text" class="form-control"
                        placeholder="Nombre y Apellido" required />
                </div>

                <div class="col-md-3">
                    <label for="fechaTurno" class="form-label">Fecha</label>
                    <input id="fechaTurno" name="fechaTurno" type="date" class="form-control"/>
                </div>

                <div class="col-md-3">
                    <label for="horarioTurno" class="form-label">Horario</label>
                    <input id="horarioTurno" name="horarioTurno" type="time" class="form-control"/>
                </div>

                <div class="col-md-4">
                    <label for="especialidadTurno" class="form-label">Especialidad</label>
                    <input id="especialidadTurno" name="especialidadTurno" type="text" class="form-control"
                        placeholder="Especialidad" required />
                </div>

                <div class="col-md-4">
                    <label for="obrasocialTurno" class="form-label">Obra social</label>
                    <input id="obrasocialTurno" name="obrasocialTurno" type="text" class="form-control"
                        placeholder="Obra social" />
                </div>

                <div class="col-12 d-flex gap-2">
                    <button id="btnGuardar" type="submit" class="btn btn-success">Guardar</button>
                    <button id="btnCancelar" type="button" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="border p-3 rounded shadow-sm bg-white">

            <table class="table table-bordered align-middle" id="tablaTurnos">
                <thead class="table-success">
                    <tr>
                        <th>Médico</th>
                        <th>Disponible</th>
                        <th>Fecha</th>
                        <th>Horario</th>
                        <th>Especialidad</th>
                        <th class="d-none d-md-table-cell">Obra Social</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="turnos-tbody">
                </tbody>
            </table>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; T.F.I. | Introducción al Desarrollo Web - 2025</p>
    </footer>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
            <script src="js/validarLogin.js"></script>
            <script type="module" src="js/gestionTurnosAdmin.js"></script>
        </body>

</html>
