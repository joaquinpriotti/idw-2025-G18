    <main>
       <h1>Comunicate con nosotros</h1>
        <form>
            <div class="form-individual">
                <label class="form-label"><p>Nombre y Apellido</p></label>
                <input class ="form-control form-control-lg" type="text" name="Nombre y apellido" placeholder="Nombre y Apellido">
            </div>
            <div class="form-individual">
                <label class="form-label"><p>DNI</p></label>
                <input class = "form-control form-control-lg" type="text" name="DNI" placeholder="DNI">
            </div>
            <div class="form-individual">
                <label class="form-label"><p>Edad</p></label>

            </div>
            <div class="form-individual">
                <label class="form-label"><p>Teléfono</p></label>

            </div>
            <div class="form-individual">
                <label class="form-label"><p>Correo Electrónico</p></label>
                <input class="form-control form-control-lg"  type="email" name="Correo" placeholder="Correo Electrónico" >
            </div>
            <div class="form-individual">
                <label class="form-label"><p>Mensaje</p></label>
                <textarea class="form-control" name="Mensaje" placeholder="Mensaje"></textarea>
            </div>
            <button class="btn btn-primary btn-sm" type="submit"><p>Enviar</p></button>           
        </form>
