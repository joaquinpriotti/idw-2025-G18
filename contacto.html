<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Clínica Médica</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header class="container-fluid text-white py-3">
        <div class="d-flex align-items-center">
            <img src="favicon.svg" alt="Logo de la clínica" height="60">
            <h1 class="ms-3">Clínica Médica</h1>
        </div>
    </header>

    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="institucional.html">Institucional</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <div id="botonAdmin"></div>
                    <div id="botonDinamico"></div>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container my-5">
        <h1 class="text-center mb-4 text-primary">Comunicate con nosotros</h1>

        <form class="contacto-form">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre y Apellido</label>
                <input id="nombre" name="nombre" type="text" class="form-control form-control-lg"
                    placeholder="Nombre y Apellido" required>
            </div>
            <div class="mb-3">
                <label for="dni" class="form-label">DNI</label>
                <input id="dni" name="dni" type="text" class="form-control form-control-lg" placeholder="DNI" required>
            </div>
            <div class="mb-3">
                <label for="edad" class="form-label">Edad</label>
                <input id="edad" name="edad" type="number" class="form-control form-control-lg" placeholder="Edad">
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" class="form-control form-control-lg"
                    placeholder="Teléfono">
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input id="correo" name="correo" type="email" class="form-control form-control-lg"
                    placeholder="correo@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea id="mensaje" name="mensaje" class="form-control" rows="4"
                    placeholder="Escriba su mensaje aquí"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Enviar</button>
        </form>

        <section class="mt-5 text-center">
            <h2 class="text-primary">Información de contacto</h2>
            <ul class="list-unstyled">
                <li><strong>Dirección:</strong> Av. M. Ruben 3590</li>
                <li><strong>Teléfono:</strong> (03492) 1234-5678</li>
                <li><strong>Email:</strong>
                    <a href="mailto:contacto@clinicamedica.com">contacto@clinicamedica.com</a>
                </li>
            </ul>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; T.F.I. | Introducción al Desarrollo Web - 2025</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/validarLogin.js"></script>
</body>

</html>
