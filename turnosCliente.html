<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alta - Clínica Médica</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <header class="container-fluid text-white py-3">
        <div class="d-flex align-items-center">
            <img src="favicon.svg" alt="Logo de la clínica" height="60" />
            <h1 class="ms-3">Clínica Médica</h1>
        </div>
    </header>

    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="institucional.html">Institucional</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <div id="botonAdmin"></div>
                    <div id="botonDinamico"></div>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="text-center mb-4 text-primary">Turnos</h2>

        <section class="mb-4">
            <form id="formularioTurnos" class="row g-3">
                <input type="hidden" id="turnosId" />

                <div class="col-md-3">
                    <label for="fechaFiltro" class="form-label">Fecha del Turno</label>
                    <input id="fechaFiltro" name="fechaFiltro" type="date" class="form-control" />
                </div>

                <div class="col-md-3">
                    <label for="especialidadFiltro" class="form-label">Especialidad</label>
                    <select id="especialidadFiltro" name="especialidadFiltro" class="form-select">
                        <option selected value="">Todas las Especialidades</option>
                        <option value="Cardiología">Cardiología</option>
                        <option value="Odontología">Odontología</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="medicoFiltro" class="form-label">Médico (Opcional)</label>
                    <input id="medicoFiltro" name="medicoFiltro" type="text" class="form-control"
                        placeholder="Nombre y Apellido del Médico" />
                </div>

                <div class="col-md-3">
                    <label for="obrasocialFiltro" class="form-label">Obra Social (Opcional)</label>
                    <input id="obrasocialFiltro" name="obrasocialFiltro" type="text" class="form-control"
                        placeholder="Obra social" />
                </div>

                <div class="col-12 d-flex gap-2">
                    <button id="btnFiltrar" type="submit" class="btn btn-primary">Filtrar Turnos</button>
                    <button id="btnLimpiar" type="button" class="btn btn-secondary">Limpiar Filtros</button>
                </div>
            </form>
        </section>

        <section class="border p-3 rounded shadow-sm bg-white">

            <table class="table table-bordered align-middle" id="tablaTurnos">
                <thead class="table-success">
                    <tr>
                        <th>Médico</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Horario</th>
                        <th>Especialidad</th>
                        <th class="d-none d-md-table-cell">Obra Social</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="turnos-tbody">
                </tbody>
            </table>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; T.F.I. | Introducción al Desarrollo Web - 2025</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!--<script src="js/validarLogin.js"></script>-->
    <script type="module" src="js/gestionTurnosCliente.js"></script>
    <script src="js/validarLogin.js"></script>
    <script src="js/navbarLogin.js"></script>
</body>

</html>
